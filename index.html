<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- index.html은 항상 최신을 받도록(배포 즉시 새 번들 반영). 해시된 에셋은 계속 캐시됨 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- 파비콘: public/ 에 넣은 파일을 참조(배포 시 Vite가 base 경로를 붙여줌) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>자산관리 플랫폼</title>
    <meta name="description" content="The SMC 총무 업무 통합 관리 플랫폼" />
    <!-- 오픈그래프(카카오톡·슬랙·페이스북 등 링크 미리보기용).
         ⚠️ 크롤러는 상대경로를 못 읽으므로 og:image는 반드시 절대 URL.
         이미지 파일은 public/og-image.png 로 넣으면 배포 시 아래 주소로 서빙됩니다. 권장 크기 1200×630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The SMC Platform" />
    <meta property="og:title" content="The SMC Platform" />
    <meta property="og:description" content="The SMC 총무 업무 통합 관리 플랫폼" />
    <meta property="og:url" content="https://thesmc.github.io/smc-admin/" />
    <meta property="og:image" content="https://thesmc.github.io/smc-admin/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The SMC Platform" />
    <meta name="twitter:description" content="The SMC 총무 업무 통합 관리 플랫폼" />
    <meta name="twitter:image" content="https://thesmc.github.io/smc-admin/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
